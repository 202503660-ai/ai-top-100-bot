services:
  - type: web
    name: ai-top-100-kakao-bot
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn kakao_bot_agent_template:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PIN
        value: "1031"
      - key: OPENAI_API_KEY
        sync: false
      - key: KAKAO_BOT_TOKEN
        sync: false
